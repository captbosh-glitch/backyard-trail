<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backyard &amp; Trail</title>
<meta name="description" content="See the plants, wildlife and natural hazards documented near your backyard, your trail or your next destination.">
<meta name="theme-color" content="#17352b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backyard & Trail">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
<style>
  /* the reset the artifact prototype got from its host */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; min-height: 100vh; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<input type="file" id="cam-input" accept="image/*" capture="environment" hidden>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">Backyard &amp; Trail needs JavaScript to look up sightings near you.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="data.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
